# Hạ tầng cục bộ của pipeline GDELT. Chạy: docker compose up -d
name: gdelt-pipeline

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"                      # chỉ mở cổng EXTERNAL ra máy host
    environment:
      # --- Chế độ KRaft: một tiến trình vừa là broker vừa là controller, không cần ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Ba "cổng nghe": nội bộ Docker, từ máy host, và cho controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Chỉ có 1 broker nên mọi hệ số nhân bản phải là 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topic phải được tạo có chủ đích, gõ sai tên topic sẽ báo lỗi thay vì âm thầm tạo topic mới
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # --- Lưu trữ
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168        # giữ message 7 ngày
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m    # giới hạn RAM cho máy cá nhân
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gdelt-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data: