# Hạ tầng cục bộ của pipeline GDELT
# Chạy: docker compose up -d

name: gdelt-pipeline

x-airflow: &airflow
  image: apache/airflow:2.10.5
  user: "50000:0"
  env_file:
    - .env                       # AWS_*, S3_BUCKET, CLICKHOUSE_* để chuyển tiếp cho container tác vụ
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-gdelt-local-demo}
    # Địa chỉ dịch vụ bên trong mạng Docker, cho container tác vụ
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CLICKHOUSE_HOST: clickhouse
    PIPELINE_NETWORK: gdelt-pipeline_default
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock

services:
  # Cấu hình dùng chung cho các Spark container
  spark-base:
    image: gdelt-spark:latest
    build: ./processing
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - spark-checkpoints:/opt/spark/checkpoints
    profiles:
      - base

  spark-master:
    image: gdelt-spark:latest
    build: ./processing
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - spark-checkpoints:/opt/spark/checkpoints
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      - "8090:8080"
    restart: unless-stopped

  spark-worker:
    image: gdelt-spark:latest
    pull_policy: never
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - spark-checkpoints:/opt/spark/checkpoints
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "6"       # silver 2 + gold 1 + batch GKG 3
      - --memory
      - 5g        # silver 1g + gold 1g + batch GKG 2,5g
    ports:
      - "8091:8081"
    depends_on:
      - spark-master
    restart: unless-stopped

  spark-streaming:
    image: gdelt-spark:latest
    pull_policy: never
    hostname: spark-streaming
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - spark-checkpoints:/opt/spark/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-streaming
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.driver.memory=768m
      - /opt/gdelt/jobs/events_silver.py
    ports:
      - "4041:4040"
    depends_on:
      kafka:
        condition: service_healthy
      spark-worker:
        condition: service_started
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: gdelt
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./serving/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  spark-gold:
    image: gdelt-spark:latest
    pull_policy: never
    hostname: spark-gold
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - ./processing/lookups:/opt/gdelt/lookups:ro
      - spark-checkpoints:/opt/spark/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-gold
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.driver.memory=768m
      - /opt/gdelt/jobs/gold_events.py
    ports:
      - "4042:4040"
    depends_on:
      clickhouse:
        condition: service_healthy
      spark-worker:
        condition: service_started
    restart: unless-stopped

    
  spark-batch:
    image: gdelt-spark:latest
    pull_policy: never
    profiles: ["batch"] # Không tự chạy khi docker compose up
    hostname: spark-batch
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./processing/jobs:/opt/gdelt/jobs:ro
      - ./processing/lookups:/opt/gdelt/lookups:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-batch
      - --conf
      - spark.cores.max=3
      - --conf
      - spark.executor.memory=2500m
      - --conf
      - spark.driver.memory=1g
      - /opt/gdelt/jobs/gkg_weekly.py
    depends_on:
      clickhouse:
        condition: service_healthy
      spark-worker:
        condition: service_started
    restart: "no"



  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gdelt-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  ingest:
    build: ./ingestion
    image: gdelt-ingest:latest
    profiles: ["tools"]            # chỉ để build và chạy tay, không tự chạy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Admin --lastname GDELT --role Admin --email admin@example.com || true)
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8089:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- phục vụ người dùng
  api:
    build: ./serving/api
    image: gdelt-api:latest
    environment:                   # chỉ nhận thông tin ClickHouse, không cần khoá AWS
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./serving/dashboard
    image: gdelt-dashboard:latest
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  spark-checkpoints:
  kafka-data:
  clickhouse-data:
  airflow-db:
  airflow-logs: